<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comum :: head(${disciplina.id} == null ? 'Nova Disciplina' : 'Editar Disciplina')}"></head>
<body>
<div th:replace="~{fragments/comum :: header}"></div>
<div class="container">
    <h1 th:text="${disciplina.id} == null ? 'Nova Disciplina' : 'Editar Disciplina'"></h1>

    <div class="card">
        <form th:action="@{/disciplinas/salvar}" th:object="${disciplina}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="field">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}">
                <div class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>

            <div class="field">
                <label for="cargaHoraria">Carga Horária (horas)</label>
                <input type="number" id="cargaHoraria" th:field="*{cargaHoraria}" min="1">
                <div class="error" th:if="${#fields.hasErrors('cargaHoraria')}" th:errors="*{cargaHoraria}"></div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">Salvar</button>
                <a class="btn btn-secondary" th:href="@{/disciplinas}">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
