<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comum :: head(${turma.id} == null ? 'Nova Turma' : 'Editar Turma')}"></head>
<body>
<div th:replace="~{fragments/comum :: header}"></div>
<div class="container">
    <h1 th:text="${turma.id} == null ? 'Nova Turma' : 'Editar Turma'"></h1>

    <div class="card">
        <form th:action="@{/turmas/salvar}" th:object="${turma}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="field">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: 3º Ano A">
                <div class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>

            <div class="field">
                <label for="anoLetivo">Ano Letivo</label>
                <input type="text" id="anoLetivo" th:field="*{anoLetivo}" placeholder="Ex: 2026">
                <div class="error" th:if="${#fields.hasErrors('anoLetivo')}" th:errors="*{anoLetivo}"></div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">Salvar</button>
                <a class="btn btn-secondary" th:href="@{/turmas}">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
