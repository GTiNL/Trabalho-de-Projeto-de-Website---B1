<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Login</title></head>
<body style="font-family:sans-serif;max-width:320px;margin:60px auto">
<h2>Login</h2>
<p style="color:red" th:if="${erro}" th:text="${erro}"></p>
<p style="color:green" th:if="${msg}" th:text="${msg}"></p>
<form method="post" action="/login">
  <p>Email<br><input type="email" name="email" required></p>
  <p>Senha<br><input type="password" name="senha" required></p>

  <button type="submit">Entrar</button>
</form>
<p><a href="/cadastro">Criar conta</a> | <a href="/resetar">Esqueci a senha</a></p>
</body>
</html>
