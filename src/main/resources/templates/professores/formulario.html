<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comum :: head(${professor.id} == null ? 'Novo Professor' : 'Editar Professor')}"></head>
<body>
<div th:replace="~{fragments/comum :: header}"></div>
<div class="container">
    <h1 th:text="${professor.id} == null ? 'Novo Professor' : 'Editar Professor'"></h1>

    <div class="card">
        <form th:action="@{/professores/salvar}" th:object="${professor}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="field">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}">
                <div class="error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>

            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" id="email" th:field="*{email}">
                <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="field">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" th:field="*{telefone}">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">Salvar</button>
                <a class="btn btn-secondary" th:href="@{/professores}">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
